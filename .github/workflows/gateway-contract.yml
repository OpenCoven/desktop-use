name: Gateway contract

on:
  pull_request:
    paths:
      - '.github/workflows/gateway-contract.yml'
      - 'scripts/qualify-gateway.mjs'
      - 'scripts/gateway-image-fixture.mjs'
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'index.ts'
      - 'src/**'
      - 'agents/**'
      - 'openclaw.plugin.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: gateway-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [full, observation-only, desktop-only, stop-only]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.profile == 'full' && 35 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Stage the pinned host image backend without install scripts
        run: npm install --prefix "$RUNNER_TEMP/gateway-host" --ignore-scripts --no-audit --no-fund openclaw@2026.4.26 sharp@0.34.5
      - run: cargo build --locked
      - name: Pack the plugin and run the minimum supported gateway
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gateway-package" "$RUNNER_TEMP/gateway-packed"
          pnpm pack --pack-destination "$RUNNER_TEMP/gateway-package"
          tar -xzf "$RUNNER_TEMP/gateway-package/"*.tgz -C "$RUNNER_TEMP/gateway-packed"
          node scripts/qualify-gateway.mjs "$RUNNER_TEMP/gateway-receipts/${{ matrix.profile }}" "$RUNNER_TEMP/gateway-host/node_modules/openclaw" "$RUNNER_TEMP/gateway-packed/package" "${{ matrix.profile }}"
      - name: Preserve contract evidence without gateway credentials or profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-contract-${{ matrix.os }}-${{ matrix.profile }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/action-permissions.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/restricted-summary.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-direct.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-result.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/runtime-version.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/health.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/audit-path-preflight.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/effective-tools.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/minimal-effective-tools.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/legacy-effective-tools.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/model-requests.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/model-error-sanitization.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/model-tool-schemas.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/adapter-fixture.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/provider-image-*.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/legacy-action-compatibility.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/legacy-tool-compatibility.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/events.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-approval.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-outcome.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-history.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-cancellation.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/*-timing.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/audit-summary.json
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/state/agents/computer-use/audit/computer-use.jsonl
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/state/agents/legacy-qualification/audit/computer-use.jsonl
            ${{ runner.temp }}/gateway-receipts/${{ matrix.profile }}/console.log
