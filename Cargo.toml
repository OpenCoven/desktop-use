[package]
name = "coven-desktop-use"
version = "0.1.2"
edition = "2021"
rust-version = "1.88"
description = "OpenCoven desktop-use adapter for OpenClaw computer-use integrations"
license = "MIT"
repository = "https://github.com/OpenCoven/desktop-use"

[[bin]]
name = "coven-desktop-use"
path = "src/main.rs"

[dependencies]
crc32fast = "=1.5.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
jpeg-decoder = { version = "=0.3.2", path = "vendor/jpeg-decoder", default-features = false }
serde_json = "1"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }
# jsonschema's UUID format validator accepts this version; newer uuid requires Rust 1.89.
uuid = { version = "=1.18.1", default-features = false }
